<title>Mis Finanzas</title>
<style>
/* Layout: columna de captura a la izquierda, mes y movimientos a la derecha; en celular todo en una columna. */
:root{
  /* One UI oscuro: negro puro, tarjetas carbón, acento azul */
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#2F2F31;
  --fg:#F5F5F7; --muted:#9A9AA0;
  --accent:#6E97FF; --accent-fg:#0A1020; --accent-soft:#1B2A52;
  --ok:#5ED07A; --ok-soft:#14321F;
  --warn:#FFA978; --warn-soft:#3A2416;
  --bad:#FF8A7A; --bad-soft:#3D1B1B;
  --line-ui:#6E6E72; /* bordes de controles: 3.3:1 sobre la tarjeta */
  --r-card:28px; --r-ctl:14px;
  --f-display:Inter,"Segoe UI",system-ui,sans-serif;
  --f-body:Inter,"Segoe UI",system-ui,sans-serif;
  --f-mono:Inter,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}

.tcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tcs>div{background:var(--surface-2);border:0;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcs label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tcs b{font-family:var(--f-mono);font-size:1.25rem;font-weight:500}
.tcs small{color:var(--muted);font-size:.75rem}
@media(max-width:560px){.tcs{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tcs>div{padding:10px}.tcs b{font-size:.875rem}.tcs small{font-size:.75rem}}
.tcs .ok b{color:var(--ok)}.tcs .warn b{color:var(--warn)}
.tcl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 24px}
.tcl h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
.tcl ul{list-style:none;margin:0;padding:0}
.tcl li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:.875rem}
.tcl li span:first-child{font-family:var(--f-mono);color:var(--muted);font-size:.75rem}
.tcl li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tcl li em{font-style:normal;font-family:var(--f-mono);text-align:right}
.tcl li.tot{font-weight:600;border-bottom:0}
.tcset{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.tcset label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted)}
.tcset input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg);font:inherit;min-width:0;width:100%}
.acc{display:grid;grid-template-columns:minmax(110px,1.3fr) repeat(3,minmax(0,1fr));gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;font-size:.875rem}
.acc span,.acc b:last-child{font-family:var(--f-mono);text-align:right;font-size:.875rem}
.acc.head{border-top:0;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.acc.head span{font-family:inherit;font-size:.75rem}
.acc.head span:first-child{text-align:left}
.acc.head{padding-top:0}
.acc .pos{color:var(--ok)}.acc .neg{color:var(--bad)}
@media(max-width:560px){.acc{grid-template-columns:1.2fr 1fr 1fr 1fr;font-size:.875rem}.acc span,.acc b:last-child{font-size:.75rem}}
.dupl{display:flex;flex-direction:column}
.dupi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dupi b{font-family:var(--f-mono);font-weight:500}
.dupi small{display:block;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.dupi .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.dupi{grid-template-columns:1fr}.dupi .bt{justify-content:flex-start}}
/* pestañas, gráficos y tablas dinámicas */

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:6px 12px;align-items:center}
.pl .n{min-width:0}.pl .n small{display:block;color:var(--muted);font-size:.75rem}
.pl input[type=number]{text-align:right;font-family:var(--f-mono)}
.pl .sub{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar i.w{background:var(--warn)}.pbar i.b{background:var(--bad)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.pv td.pos,.pv td.neg{font-weight:600}
.pnote{font-size:.875rem;color:var(--muted);margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
@media(max-width:480px){.tab{padding:10px 9px;font-size:.875rem}}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.ctl .fld{min-width:150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:0;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1}
.tile .s{font-size:.875rem;color:var(--muted)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.chart{min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.chart text.vl{fill:var(--fg);font-family:var(--f-mono);font-size:11px}
.hit{fill:transparent;cursor:crosshair;outline:none}
.hit:hover,.hit:focus{fill:rgba(255,255,255,.05)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;color:var(--muted);margin-right:14px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.875rem;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:240px}
.tip .t{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;gap:14px;align-items:center;justify-content:space-between}
.tip .r b{font-family:var(--f-mono);font-weight:600}
.tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
details.dt{margin-top:10px}
details.dt summary{cursor:pointer;color:var(--muted);font-size:.875rem}
.pvwrap{overflow:auto;border:1px solid var(--line);border-radius:18px;max-height:70vh}
table.pv{border-collapse:separate;border-spacing:0;width:100%;font-size:.875rem}
.pv th,.pv td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pv thead th{position:sticky;top:0;background:var(--surface-2);text-align:right;z-index:2;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pv th:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;font-weight:500}
.pv thead th:first-child{background:var(--surface-2);z-index:3}
.pv td{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pv td.tot,.pv tfoot td,.pv tfoot th{font-weight:600;background:var(--surface-2)}
.pv tfoot th{position:sticky;left:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.022em;font-weight:700}
h1{font-size:clamp(1.75rem,1.4rem + 1.4vw,2.25rem);line-height:1.12}
h2{font-size:1.25rem;line-height:1.2}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--muted)}
.monthsel{display:flex;align-items:center;gap:8px}
label{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=number]{
  background:var(--surface-2);border:1px solid var(--line-ui);border-radius:var(--r-ctl);padding:10px 14px;min-height:46px;width:100%;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:0;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:.875rem}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:0;border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:0;border-radius:999px;overflow:hidden;background:var(--surface-2);padding:4px;gap:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
@media(max-width:480px){.seg label{font-size:.75rem!important;padding-inline:2px!important}}
.seg label{margin:0;text-transform:none;letter-spacing:0;font-size:.875rem;text-align:center;padding:9px 4px;cursor:pointer;background:transparent;color:var(--fg);border-right:0;border-radius:999px;font-weight:500}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--accent);color:var(--accent-fg)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.hint{font-size:.875rem;color:var(--muted);margin:0}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;min-height:46px}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:0}
.btn.sm{min-height:40px;padding:8px 12px;font-size:.875rem}
.btn:hover{filter:brightness(1.07)}
.cat-row{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto;gap:10px;align-items:center}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.sal{background:var(--warn)}
.bar i.inc{background:var(--ok)}
[hidden]{display:none!important}
.cat-row .n{font-family:var(--f-mono);font-size:.875rem;font-variant-numeric:tabular-nums;text-align:right}
.cat-row .t{font-size:.875rem;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tools .l{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:.75rem;font-weight:600;border:0;cursor:pointer}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.mv{display:grid;grid-template-columns:3.3rem minmax(0,1fr) 11rem 7.5rem 7.6rem 2.4rem;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.sortb{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.sortb:hover,.sortb.on{color:var(--ink,currentColor)}
.sortb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mv.head{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:0 8px}
.mv .d{font-family:var(--f-mono);font-size:.875rem;color:var(--muted)}
.mv .c{min-width:0}
.mv .c b{font-weight:500;overflow-wrap:anywhere}
.mv .c small{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);margin-top:3px}
.mv .m{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.mv .m.in{color:var(--ok)}
.tc{display:flex;flex-direction:column;gap:4px;min-width:0}
@media(max-width:720px){.tc{flex-direction:row}.tc select{flex:1}}
.mv.nohoja{opacity:.8}
.mv select{padding:6px 8px;min-height:36px;font-size:.875rem}
.x{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:8px;padding:0;cursor:pointer}
.x svg{width:18px;height:18px;pointer-events:none}
.x:hover{color:var(--bad);border-color:var(--line)}
.x.arm{color:#2A0E0A;background:var(--bad);border-color:var(--bad)}
.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:720px){
  .mv.head{display:none}
  .mv{grid-template-columns:2.6rem minmax(0,1fr) 6.2rem 2.4rem;grid-template-areas:"d c m x" "cat cat cat cat" "tag tag tag tag"}
  .mv .tag:empty{display:none}
  .mv .d{grid-area:d}.mv .c{grid-area:c}.mv .m{grid-area:m}
  .mv .cat{grid-area:cat}.mv .tag{grid-area:tag}.mv .act{grid-area:x;justify-self:end;align-self:start}
}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.875rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:9}
.tablewrap{min-width:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.filters .fld{gap:4px}
.ed{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 7px;min-height:34px;width:100%;min-width:0;font:inherit}

.ed:focus{background:var(--surface);border-color:var(--accent)}
.ed.amt{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;padding-inline:4px}

.cat-row.pick{cursor:pointer}
.cat-row.pick:hover .t{text-decoration:underline}
.cat-row.on .t{font-weight:600;color:var(--accent)}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* dashboard */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}

.dl{display:flex;flex-direction:column;gap:14px}

function hideTip(){const t=$("tip");if(t)t.hidden=true}

  const t=$("tip");t.replaceChildren();

function bindTips(root){
root.addEventListener("pointermove",e=>{
  const el=e.target.closest("[data-ch]");if(!el){hideTip();return}

  if(el.dataset.line){

    const xh=$(ch+"-xh"),dt=$(ch+"-dot");
    const x=L.pad+i*L.step;xh.setAttribute("x1",x);xh.setAttribute("x2",x);xh.style.display="";
    dt.setAttribute("cx",x);dt.setAttribute("cy",L.ys[i]);dt.style.display="";
  }

/* utilidades de gráfico */
function niceTicks(max){
  if(!(max>0))return {top:1,ticks:[0,1]};
  const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;
  const st=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;
  const top=Math.ceil(max/st)*st,ticks=[];
  for(let v=0;v<=top+st/1000;v+=st)ticks.push(Math.round(v*100)/100);
  return {top,ticks};
}
const ytxt=v=>v>=1000?(v/1000).toLocaleString("en-US",{maximumFractionDigits:2})+"k":String(v);
function roundTop(x,y,w,h,r){ // esquinas redondeadas arriba, base cuadrada
  if(h<=0)return "";if(h<r*2||w<r*2)return `M${x},${y+h}V${y}H${x+w}V${y+h}Z`;
  return `M${x},${y+h}V${y+r}a${r},${r} 0 0 1 ${r},${-r}H${x+w-r}a${r},${r} 0 0 1 ${r},${r}V${y+h}Z`;
}
function roundRight(x,y,w,h,r){ // esquinas redondeadas a la derecha, base a la izquierda
  if(w<r*2||h<r*2)return `M${x},${y}H${x+Math.max(w,1)}V${y+h}H${x}Z`;
  return `M${x},${y}H${x+w-r}a${r},${r} 0 0 1 ${r},${r}V${y+h-r}a${r},${r} 0 0 1 ${-r},${r}H${x}Z`;
}
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
const tableHTML=(head,rows)=>`<details class="dt"><summary>Ver como tabla</summary><div class="pvwrap" style="margin-top:8px"><table class="pv"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><th>${esc(r[0])}</th>${r.slice(1).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;

function hbarsSVG(id,rows,color,W,unit){
  const labW=Math.min(150,Math.max(96,W*.34)), padR=74, rowH=30, bh=20, H=rows.length*rowH+4;
  const max=Math.max(...rows.map(r=>r.v),1), aw=W-labW-padR;
  TT[id]=rows.map(r=>({t:r.l,rows:[[unit||"Total",fmt(r.v),color],...(r.extra||[])]}));
  const maxCh=Math.floor(labW/6.3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(id)}">`;
  rows.forEach((r,i)=>{
    const y=i*rowH+(rowH-bh)/2, w=Math.max(r.v/max*aw,2);
    s+=`<text x="${labW-8}" y="${y+bh/2+4}" text-anchor="end" class="lb">${esc(trunc(r.l,maxCh))}</text>`;
    s+=`<path d="${roundRight(labW,y,w,bh,4)}" fill="${color}"/>`;
    s+=`<text x="${labW+w+6}" y="${y+bh/2+4}" class="vl">${esc(fmt0(r.v))}</text>`;
    s+=`<rect class="hit" tabindex="0" data-ch="${id}" data-i="${i}" x="0" y="${i*rowH}" width="${W}" height="${rowH}" aria-label="${esc(r.l+": "+fmt(r.v))}"/>`;
  });
  return s+"</svg>";
}
function topRows(map,limit){
  let rows=Object.entries(map).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
  if(rows.length>limit){const tail=rows.slice(limit-1);rows=rows.slice(0,limit-1).concat([{l:"Otras ("+tail.length+")",v:tail.reduce((s,r)=>s+r.v,0),extra:[]}])}
  return rows;
}
function groupSum(arr,fn){const o={};arr.forEach(m=>{const k=fn(m);o[k]=(o[k]||0)+m.monto});return o}

function chartMeses(el,id="a"){
  const meses=[...new Set(movs.map(m=>mesKey(m.fecha)))].sort();
  const hoyK=todayISO().slice(0,7);
  const D=meses.map(k=>{const a=movs.filter(m=>mesKey(m.fecha)===k);const i=sumA(a.filter(m=>m.tipo==="Ingreso")),e=sumA(a.filter(m=>m.tipo==="Egreso"));return {k,i,e}});
  const W=el.clientWidth||340,H=230,pl=44,pr=8,pt=22,pb=26,n=D.length;
  const {top,ticks}=niceTicks(Math.max(...D.map(d=>Math.max(d.i,d.e)),1));
  const y=v=>pt+(H-pt-pb)*(1-v/top), band=(W-pl-pr)/n, bw=Math.min(34,band/2.3);

  });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg>`;
  el.innerHTML=`<div style="margin-bottom:6px"><span class="lg"><i style="background:${C_ING}"></i>Ingresos</span><span class="lg"><i style="background:${C_EGR}"></i>Egresos</span>${meses.includes(hoyK)?'<span class="lg">* mes en curso</span>':""}</div>`+s+
    tableHTML(["Mes","Ingresos","Egresos","Balance"],D.map(d=>[mesLabel(d.k),fmt(d.i),fmt(d.e),fmt(d.i-d.e)]));

function catMesHTML(){

function addM(k,n){const d=new Date(+k.slice(0,4),+k.slice(5,7)-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function deudasCalc(){
  const hoyK=todayISO().slice(0,7);
  return CFG.debts.map(d=>{
    const pagos=movs.filter(m=>m.tipo==="Pago de deuda"&&m.cat===d.name);
    const pag=sumA(pagos), pen=Math.max(d.total-pag,0);

}

const PEND_SKIP=["Por confirmar","Solo anotar","Transferencia propia"];
const tipoReal=m=>m._sa?m.tipoDB:m.tipo;
function gkey(m){return tipoReal(m)+"|"+String(m.comentario||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[0-9]+/g," ").replace(/\s+/g," ").trim()}
function histCat(){
  const hist={};
  movs.forEach(m=>{if(m.estado==="revisar"||PEND_SKIP.includes(m.cat))return;const k=gkey(m);(hist[k]=hist[k]||{});hist[k][m.cat]=(hist[k][m.cat]||0)+1});
  return hist;
}
function sugerir(m,hist){
  const t=tipoReal(m), com=String(m.comentario||"").toLowerCase();
  const h=hist[gkey(m)];if(!h)return null;
  const best=Object.entries(h).sort((a,b)=>b[1]-a[1])[0];
  return best?{cat:best[0],why:"antes lo pusiste así ("+best[1]+(best[1]===1?" vez":" veces")+")"}:null;
}
async function aplicarCat(ids,cat){
  for(const id of ids){
    const m=movs.find(x=>x.id===id);if(!m)continue;
    const upd={cat,estado:"ok"};
    if(!(ETQ_BY[cat]&&ETQ_BY[cat].includes(m.etiqueta||"")))upd.etiqueta="";
    await col.doc(id).update(upd);
  }
}
function pendGrupos(){
  let P=movs.filter(m=>m.estado==="revisar"&&!m._tf);
  if(!PG.all)P=P.filter(m=>mesKey(m.fecha)===mesSel);
  const G={};P.forEach(m=>{const k=gkey(m);(G[k]=G[k]||[]).push(m)});
  return {P,gl:Object.values(G).map(a=>({a:a.sort((x,y)=>y.fecha.localeCompare(x.fecha)),tot:sumA(a),t:tipoReal(a[0])})).sort((x,y)=>y.tot-x.tot)};
}
function renderPend(){
  const out=$("pendout");if(!out)return;
  const hist=histCat(), {P,gl}=pendGrupos();
  const nS=gl.filter(g=>sugerir(g.a[0],hist)).length;
  const alc=PG.all?"todos los meses":mesLabel(mesSel);
  let h=`<section class="card"><div class="top2"><div><h2>Pendientes de revisar</h2><p class="hint" style="margin:4px 0 0">${P.length} movimientos en ${gl.length} grupos · ${fmt(sumA(P))} · ${esc(alc)}. Toca una categoría y se aplica a todo el grupo.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" type="button" data-pg="alcance">${PG.all?"Solo "+esc(MESES[+mesSel.slice(5)-1]):"Todos los meses"}</button>${nS?`<button class="btn sm" type="button" data-pg="sug">${PG.sugArm?"¿Seguro? Aplicar "+nS:"Aplicar las "+nS+" sugerencias"}</button>`:""}</div></div></section>`;
  if(!gl.length){out.innerHTML=h+`<div class="empty">Nada pendiente en ${esc(alc)}. Todo al día.</div>`;return}
  const LIM=40;
  h+=`<div class="pgl">`+gl.slice(0,LIM).map(g=>{
    const m0=g.a[0], sug=sugerir(m0,hist), ids=g.a.map(x=>x.id).join(","), cats=CATS[g.t].filter(c=>!PEND_SKIP.includes(c));
    const medios=[...new Set(g.a.map(x=>x.medio).filter(Boolean))].join(", ");
    const fechas=g.a.length>1?dm(g.a[g.a.length-1].fecha)+" a "+dm(g.a[0].fecha):dm(m0.fecha);
    const nombre=g.a.length>1?String(m0.comentario||"Sin comentario").replace(/\(.*?\)/g,"").trim()||"Sin comentario":(m0.comentario||"Sin comentario");
    const det=g.a.length>1?`<details class="dt"><summary>Ver los ${g.a.length}</summary><div class="rl">${g.a.map(x=>`<div class="it"><span class="d">${dm(x.fecha)}</span><div class="c"><b>${esc(x.comentario||"Sin comentario")}</b><small>${esc(x.cat)} · ${esc(x.medio||"")}</small></div><span class="m">${fmt(x.monto)}</span></div>`).join("")}</div></details>`:"";
    return `<section class="card"><div class="pgh"><div><b>${esc(nombre)}</b><small>${g.t==="Ingreso"?"Ingreso":"Egreso"} · ${g.a.length} ${g.a.length===1?"movimiento":"movimientos"} · ${esc(fechas)}${medios?" · "+esc(medios):""} · ahora: ${esc(m0.cat)}</small></div><span class="num ${g.t==="Ingreso"?"pos":""}">${fmt(g.tot)}</span></div>
      <div class="pgc">${cats.map(c=>`<button class="chip ${sug&&sug.cat===c?"sug":"mute"}" type="button" data-pg="cat" data-ids="${esc(ids)}" data-cat="${esc(c)}">${esc(c)}${sug&&sug.cat===c?" ★":""}</button>`).join("")}<button class="chip ok" type="button" data-pg="ok" data-ids="${esc(ids)}">Está bien así</button></div>
      ${sug?`<p class="hint" style="margin:0">★ Sugerido: ${esc(sug.cat)} (${esc(sug.why)})</p>`:""}${det}</section>`;
  }).join("")+`</div>`+(gl.length>LIM?`<p class="hint">Se muestran ${LIM} de ${gl.length} grupos; al resolver estos aparecen los demás.</p>`:"");
  out.innerHTML=h;
}
$("pendout").addEventListener("click",async e=>{
  const b=e.target.closest("[data-pg]");if(!b)return;
  const a=b.dataset.pg;
  if(a==="alcance"){PG.all=!PG.all;renderPend();return}
  if(!col){toast("Sin conexión: no se guardó");return}
  try{
    if(a==="sug"){
      if(!PG.sugArm){PG.sugArm=true;renderPend();setTimeout(()=>{if(PG.sugArm){PG.sugArm=false;if(TAB.t==="pend")renderPend()}},3500);return}
      PG.sugArm=false;
      const hist=histCat(), {gl}=pendGrupos();let n=0;
      for(const g of gl){const s=sugerir(g.a[0],hist);if(s){await aplicarCat(g.a.map(x=>x.id),s.cat);n+=g.a.length}}
      toast(n+" movimientos categorizados");return;

    const ids=(b.dataset.ids||"").split(",").filter(Boolean);
    if(a==="cat"){await aplicarCat(ids,b.dataset.cat);toast(ids.length+(ids.length===1?" movimiento":" movimientos")+" → "+b.dataset.cat)}
    if(a==="ok"){for(const id of ids)await col.doc(id).update({estado:"ok"});toast("Marcado como revisado")}
  }catch(err){toast("No se pudo guardar")}
});

const DIMS={cat:["Categoría",m=>m.cat||"—"],etq:["Etiqueta",m=>m.etiqueta||"Sin etiqueta"],medio:["Medio de pago",m=>m.medio||"—"],tipo:["Tipo",m=>m.tipo],mes:["Mes",m=>mesKey(m.fecha)],dia:["Día",m=>m.fecha],com:["Comentario",m=>(m.comentario||"Sin comentario").trim()||"Sin comentario"]};
const dimLabel=(d,v)=>d==="mes"?mesLabel(v):d==="dia"?dm(v)+"/"+v.slice(0,4):v;
(()=>{
  $("prow").innerHTML=Object.entries(DIMS).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join("");
  $("pcol").innerHTML='<option value="none">Ninguna</option>'+Object.entries(DIMS).filter(([k])=>k!=="dia"&&k!=="com").map(([k,[l]])=>`<option value="${k}">${l}</option>`).join("");

[["prow","row"],["pcol","col"],["pval","val"],["ptipo","tipo"]].forEach(([id,k])=>$(id).addEventListener("change",e=>{PV[k]=e.target.value;PV.cat="";PV.pre="";renderPiv()}));
function pvAgg(a,val){if(!a.length)return null;const s=sumA(a);return val==="sum"?s:val==="count"?a.length:s/a.length}
const pvFmt=(v,val)=>v==null?"":val==="count"?String(v):fmt(v);
let pvTSV="";
function renderPiv(){
  $("pper").value=SC.all?"all":"mes";
  if(PV.row===PV.col){PV.col="none";$("pcol").value="none"}
  $("prow").value=PV.row;$("pcol").value=PV.col;$("ptipo").value=PV.tipo;$("pval").value=PV.val;
  document.querySelectorAll("#ppre [data-pre]").forEach(b=>b.classList.toggle("on",b.dataset.pre===PV.pre));
  let base=scoped().filter(m=>!PV.cat||m.cat===PV.cat).filter(m=>PV.tipo==="Todos"?(m.tipo!=="Pago de deuda"&&m.tipo!=="Solo anotar"&&m.tipo!=="Transferencia"):m.tipo===PV.tipo);
  const out=$("pout");
  if(!base.length){out.innerHTML=`<div class="empty">No hay movimientos con estas opciones.</div>`;$("pinfo").textContent="";pvTSV="";return}
  const rf=DIMS[PV.row][1], cf=PV.col==="none"?null:DIMS[PV.col][1];
  const rowsK=[...new Set(base.map(rf))], colsK=cf?[...new Set(base.map(cf))]:[];
  const cron=k=>k==="mes"||k==="dia";
  const tot=k=>sumA(base.filter(m=>rf(m)===k));
  rowsK.sort(cron(PV.row)?(a,b)=>a.localeCompare(b):(a,b)=>tot(b)-tot(a));
  if(cf)colsK.sort(cron(PV.col)?(a,b)=>a.localeCompare(b):(a,b)=>sumA(base.filter(m=>cf(m)===b))-sumA(base.filter(m=>cf(m)===a)));
  const nAll=rowsK.length, cut=PV.row==="com"&&nAll>20; if(cut)rowsK.length=20;
  const cell=(r,c)=>pvAgg(base.filter(m=>(r==null||rf(m)===r)&&(c==null||cf(m)===c)),PV.val);
  const grid=rowsK.map(r=>colsK.map(c=>cell(r,c)));
  const mx=Math.max(...grid.flat().filter(v=>v!=null),0)||1;
  const heat=v=>v==null?"":`background:rgba(110,151,255,${(.08+.4*(v/mx)).toFixed(3)})`;
  let h=`<div class="pvwrap"><table class="pv"><thead><tr><th>${DIMS[PV.row][0]}${cf?" / "+DIMS[PV.col][0]:""}</th>${colsK.map(c=>`<th>${esc(dimLabel(PV.col,c))}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  const tsv=[[DIMS[PV.row][0],...colsK.map(c=>dimLabel(PV.col,c)),"Total"]];
  rowsK.forEach((r,i)=>{
    const rt=cell(r,null);
    h+=`<tr><th>${esc(dimLabel(PV.row,r))}</th>${colsK.map((c,j)=>`<td style="${heat(grid[i][j])}">${pvFmt(grid[i][j],PV.val)}</td>`).join("")}<td class="tot">${pvFmt(rt,PV.val)}</td></tr>`;
    tsv.push([dimLabel(PV.row,r),...colsK.map((c,j)=>pvFmt(grid[i][j],PV.val)),pvFmt(rt,PV.val)]);
  });
  const ct=colsK.map(c=>cell(null,c)), gt=cell(null,null);
  h+=`</tbody><tfoot><tr><th>Total</th>${ct.map(v=>`<td>${pvFmt(v,PV.val)}</td>`).join("")}<td>${pvFmt(gt,PV.val)}</td></tr></tfoot></table></div>`;
  tsv.push(["Total",...ct.map(v=>pvFmt(v,PV.val)),pvFmt(gt,PV.val)]);
  out.innerHTML=h;
  pvTSV=tsv.map(r=>r.join("\t")).join("\n");
  $("pinfo").textContent=`${base.length} movimientos · ${SC.all?"todos los meses":mesLabel(mesSel)} · ${PV.val==="sum"?"suma":PV.val==="count"?"cantidad":"promedio"} por ${DIMS[PV.row][0].toLowerCase()}${cf?" y "+DIMS[PV.col][0].toLowerCase():""}.${PV.cat?" Solo "+PV.cat+".":""}${cut?" Top 20 de "+nAll+"; el total incluye todos.":""}`;
}
$("pcopy").addEventListener("click",async()=>{
  if(!pvTSV){toast("No hay tabla para copiar");return}
  try{await navigator.clipboard.writeText(pvTSV);toast("Tabla copiada. Pégala en Google Sheets")}catch(e){toast("No se pudo copiar")}

/* ---------- importar CSV ---------- */
function parseCSV(txt){
  txt=String(txt).replace(/^﻿/,"");
  const first=txt.split(/\r?\n/,1)[0]||"";
  const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cell);cell=""}

    else cell+=c;

function isoFecha(y,mo,d){const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parseFecha(s){
  s=String(s||"").trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return isoFecha(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return isoFecha(y,+m[2],+m[1])}
  return null;
}
function parseMonto(s){
  s=String(s==null?"":s).trim().replace(/[^\d.,\-]/g,"");
  if(!s)return NaN;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(lc>=0){s=/,\d{1,2}$/.test(s)?s.replace(",","."):s.replace(/,/g,"")}
  else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,"")}
  const n=parseFloat(s);
  return isFinite(n)?Math.round(Math.abs(n)*100)/100:NaN;
}
function parseTipo(s){
  const x=sinAc(s);
  if(/^(egreso|gasto|salida|e)$/.test(x))return "Egreso";
  if(/^(ingreso|entrada|i)$/.test(x))return "Ingreso";
  if(/deuda|pago/.test(x))return "Pago de deuda";

}
const keyDup=m=>[m.fecha,m.tipo,Number(m.monto).toFixed(2),m.medio||"",String(m.comentario||"").toLowerCase().trim()].join("|");
function importCSV(txt){
  const rows=parseCSV(txt);
  if(rows.length<2)return {err:"El archivo está vacío o no tiene filas debajo del encabezado."};
  const H=rows[0].map(sinAc);
  const idx=names=>H.findIndex(h=>names.includes(h));
  const ix={f:idx(["fecha","date"]),t:idx(["tipo","type"]),c:idx(["categoria","categorias","category"]),m:idx(["medio","medio de pago","cuenta"]),d:idx(["comentario","detalle","descripcion","nota"]),a:idx(["monto","importe","valor","amount"]),e:idx(["etiqueta","con quien"])};
  if(ix.f<0||ix.t<0||ix.a<0)return {err:"Faltan columnas obligatorias: fecha, tipo y monto. Descarga la plantilla para ver el formato."};
  const existentes=new Set(RAW.map(keyDup));
  const nuevos=[];let dup=0,bad=0,rev=0;const medNuevos=[];
  rows.slice(1).forEach(r=>{
    const fecha=parseFecha(r[ix.f]), tipo=parseTipo(r[ix.t]), monto=parseMonto(r[ix.a]);
    if(!fecha||!tipo||!(monto>0)){bad++;return}
    let cat=ix.c>=0?String(r[ix.c]||"").trim():"", estado="ok", nota="";
    const hit=CATS[tipo].find(x=>sinAc(x)===sinAc(cat));
    if(hit)cat=hit;
    else{
      if(tipo==="Egreso"){nota=cat?"Categoría original: "+cat:"";cat="Por confirmar";estado="revisar"}
      else if(tipo==="Ingreso"){nota=cat?"Categoría original: "+cat:"";cat=CATS["Ingreso"].includes("Ingreso extra")?"Ingreso extra":CATS["Ingreso"][0];estado="revisar"}
      else cat="Otra deuda";
      if(estado==="revisar")rev++;
    }
    let medio=ix.m>=0?String(r[ix.m]||"").trim().slice(0,30):"";
    if(!medio)medio=CFG.medios[0].n;
    else{
      const mh=CFG.medios.find(x=>sinAc(x.n)===sinAc(medio));
      if(mh)medio=mh.n;
      else{CFG.medios.push({n:medio,t:false});medNuevos.push(medio)}
    }
    const m={id:uid(),fecha,tipo,cat,medio,comentario:ix.d>=0?String(r[ix.d]||"").trim().slice(0,120):"",monto,etiqueta:ix.e>=0?String(r[ix.e]||"").trim().slice(0,40):"",estado,origen:"csv"};
    if(nota)m.nota=nota;
    if(existentes.has(keyDup(m))){dup++;return}
    nuevos.push(m);
  });
  RAW.push(...nuevos);
  return {ok:nuevos.length,dup,bad,rev,medNuevos:[...new Set(medNuevos)]};
}

(function(){
  try{
    const q=new URLSearchParams(location.search).get("add");
    if(q){
      const r=$(q==="ingreso"?"t-i":"t-e");
      if(r){r.checked=true;r.dispatchEvent(new Event("change",{bubbles:true}))}
      try{syncForm()}catch(_){}
      openSheet("sheet-reg");setTimeout(()=>$("monto").focus(),300);
      history.replaceState(null,"",location.pathname);
    }
  }catch(_){}
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
